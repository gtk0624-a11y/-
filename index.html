<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>곡선중학교 출결 관리</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;900&display=swap');
        body { font-family: 'Pretendard', sans-serif; -webkit-tap-highlight-color: transparent; letter-spacing: -0.02em; }
        
        /* 누적 횟수별 파스텔 경고 색상 */
        .level-low { background-color: #FFFFFF; border: 1px solid #F1F5F9; }
        .level-warning { background-color: #FFFBEB; border: 2.5px solid #FDE68A !important; } /* 3회: 노랑 */
        .level-danger { background-color: #FEF2F2; border: 2.5px solid #FECACA !important; }  /* 5회: 분홍 */
        .level-critical { background-color: #450a0a; border: 2.5px solid #000000 !important; color: white !important; } /* 9회: 블랙 */
        .level-critical p, .level-critical span { color: #FCA5A5 !important; }

        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 10000; align-items: center; justify-content: center; padding: 15px; backdrop-filter: blur(8px); }
        .modal.active { display: flex; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        button:active { transform: scale(0.95); transition: 0.1s; }
    </style>
</head>
<body class="bg-slate-50 pb-36 text-slate-800">

    <header class="bg-white/80 backdrop-blur-md border-b border-slate-100 p-6 sticky top-0 z-50">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-xl font-black text-slate-900 tracking-tighter">곡선중 <span class="text-indigo-500">출결관리</span></h1>
                <input type="date" id="currentDate" onchange="render()" class="text-[11px] font-bold text-slate-400 bg-transparent border-none outline-none">
            </div>
            <button onclick="toggleModal('setupModal', true)" class="bg-indigo-50 text-indigo-500 px-4 py-2 rounded-2xl text-[10px] font-black border border-indigo-100">명단 등록/수정</button>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-6">
        <!-- 메인 출결 리스트 -->
        <div id="tab1" class="tab-content active space-y-3"></div>
        <!-- 기록 관리 및 수정 -->
        <div id="tab2" class="tab-content space-y-4">
            <div class="flex justify-between items-center px-2">
                <h2 class="font-black text-slate-800 text-sm">전체 기록 관리</h2>
                <button onclick="exportCSV()" class="text-[10px] font-bold text-indigo-500 bg-indigo-50 px-3 py-1.5 rounded-xl">엑셀 파일 출력</button>
            </div>
            <div id="allLogs" class="space-y-3"></div>
        </div>
    </main>

    <!-- [출결 입력 모달] - 12개 항목 전체 노출 -->
    <div id="attModal" class="modal">
        <div class="bg-white rounded-[2.5rem] p-6 w-full max-w-sm space-y-5 shadow-2xl overflow-y-auto max-h-[95vh]">
            <h2 id="attModalTitle" class="font-black text-2xl text-center text-slate-800 tracking-tighter"></h2>
            
            <div class="space-y-5">
                <!-- 1. 미인정 그룹 -->
                <div class="space-y-2">
                    <p class="text-[10px] font-black text-rose-400 ml-1">● 미인정 사유</p>
                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="recordAtt('미인정 결석')" class="py-3 bg-rose-50 text-rose-500 rounded-xl font-black text-[11px] border border-rose-100">결석</button>
                        <button onclick="recordAtt('미인정 지각')" class="py-3 bg-rose-50 text-rose-500 rounded-xl font-black text-[11px] border border-rose-100">지각</button>
                        <button onclick="recordAtt('미인정 조퇴')" class="py-3 bg-rose-50 text-rose-500 rounded-xl font-black text-[11px] border border-rose-100">조퇴</button>
                        <button onclick="recordAtt('미인정 결과')" class="py-3 bg-rose-50 text-rose-500 rounded-xl font-black text-[11px] border border-rose-100">결과</button>
                    </div>
                </div>

                <!-- 2. 질병 그룹 -->
                <div class="space-y-2">
                    <p class="text-[10px] font-black text-amber-400 ml-1">● 질병 사유</p>
                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="recordAtt('질병 결석')" class="py-3 bg-amber-50 text-amber-500 rounded-xl font-black text-[11px] border border-amber-100">질병 결석</button>
                        <button onclick="recordAtt('질병 지각')" class="py-3 bg-amber-50 text-amber-500 rounded-xl font-black text-[11px] border border-amber-100">질병 지각</button>
                        <button onclick="recordAtt('질병 조퇴')" class="py-3 bg-amber-50 text-amber-500 rounded-xl font-black text-[11px] border border-amber-100">질병 조퇴</button>
                        <button onclick="recordAtt('질병 결과')" class="py-3 bg-amber-50 text-amber-500 rounded-xl font-black text-[11px] border border-amber-100">질병 결과</button>
                    </div>
                </div>

                <!-- 3. 인정 그룹 -->
                <div class="space-y-2">
                    <p class="text-[10px] font-black text-emerald-400 ml-1">● 인정(공결) 사유</p>
                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="recordAtt('인정 결석')" class="py-3 bg-emerald-50 text-emerald-500 rounded-xl font-black text-[11px] border border-emerald-100">인정 결석</button>
                        <button onclick="recordAtt('인정 지각')" class="py-3 bg-emerald-50 text-emerald-500 rounded-xl font-black text-[11px] border border-emerald-100">인정 지각</button>
                        <button onclick="recordAtt('인정 조퇴')" class="py-3 bg-emerald-50 text-emerald-500 rounded-xl font-black text-[11px] border border-emerald-100">인정 조퇴</button>
                        <button onclick="recordAtt('인정 결과')" class="py-3 bg-emerald-50 text-emerald-500 rounded-xl font-black text-[11px] border border-emerald-100">인정 결과</button>
                    </div>
                </div>
            </div>

            <textarea id="noteText" class="w-full h-16 bg-slate-50 rounded-2xl p-4 text-xs outline-none shadow-inner" placeholder="기타 특이사항 입력..."></textarea>
            <button onclick="toggleModal('attModal', false)" class="w-full py-1 text-slate-300 text-[10px] font-bold text-center">닫기</button>
        </div>
    </div>

    <!-- [명단 관리 모달] -->
    <div id="setupModal" class="modal">
        <div class="bg-white rounded-[2.5rem] p-8 w-full max-w-sm space-y-4 shadow-2xl">
            <h2 class="font-black text-xl text-center">학생 명단 관리</h2>
            <p class="text-[10px] text-slate-400 text-center">엑셀이나 한글의 명단을 복사해서 붙여넣으세요.</p>
            <textarea id="rawList" class="w-full h-40 bg-slate-50 border-0 rounded-2xl p-4 text-[11px] outline-none shadow-inner" placeholder="학번 성명 (예: 30201 홍길동)"></textarea>
            <div class="flex gap-2">
                <button onclick="importStudents()" class="flex-1 bg-indigo-500 text-white py-4 rounded-2xl font-black shadow-lg">저장하기</button>
                <button onclick="if(confirm('모든 데이터를 초기화하시겠습니까?')){localStorage.clear(); location.reload();}" class="bg-rose-50 text-rose-500 px-4 rounded-2xl font-bold text-[10px]">전체삭제</button>
            </div>
            <button onclick="toggleModal('setupModal', false)" class="w-full text-slate-300 text-[10px] text-center font-bold">닫기</button>
        </div>
    </div>

    <!-- [기록 수정 모달] -->
    <div id="editLogModal" class="modal">
        <div class="bg-white rounded-[2.5rem] p-8 w-full max-w-sm space-y-4 shadow-2xl">
            <h2 class="font-black text-xl text-center text-slate-800 tracking-tighter">기록 수정 및 삭제</h2>
            <div id="editInfo" class="text-[10px] text-center font-black text-indigo-500 bg-indigo-50 py-2 rounded-xl"></div>
            <textarea id="editLogText" class="w-full h-32 bg-slate-50 border-0 rounded-2xl p-4 text-xs outline-none shadow-inner"></textarea>
            <div class="flex gap-2">
                <button onclick="confirmUpdate()" class="flex-1 bg-indigo-500 text-white py-4 rounded-2xl font-black shadow-lg">수정 저장</button>
                <button onclick="confirmDelete()" class="flex-1 bg-rose-50 text-rose-500 py-4 rounded-2xl font-bold text-xs">삭제하기</button>
            </div>
            <button onclick="toggleModal('editLogModal', false)" class="w-full text-slate-300 text-[10px] text-center font-bold">취소</button>
        </div>
    </div>

    <!-- 하단 네비게이션 -->
    <nav class="fixed bottom-8 left-1/2 -translate-x-1/2 bg-white/70 backdrop-blur-2xl border border-white/50 flex gap-12 px-12 py-5 rounded-[2.5rem] shadow-2xl z-50">
        <button onclick="switchTab(1)" class="nav-btn text-indigo-500 flex flex-col items-center"><i class="fas fa-calendar-check text-xl"></i><span class="text-[10px] font-black mt-1">오늘출결</span></button>
        <button onclick="switchTab(2)" class="nav-btn text-slate-300 flex flex-col items-center"><i class="fas fa-history text-xl"></i><span class="text-[10px] font-black mt-1">기록관리</span></button>
    </nav>

    <script>
        let students = JSON.parse(localStorage.getItem('att_v7_students')) || [];
        let logs = JSON.parse(localStorage.getItem('att_v7_logs')) || [];
        let currentStudentId = "";
        let editingLogId = null;

        document.getElementById('currentDate').valueAsDate = new Date();

        function toggleModal(id, show) { document.getElementById(id).classList.toggle('active', show); }

        function switchTab(n) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.getElementById(`tab${n}`).classList.add('active');
            document.querySelectorAll('.nav-btn').forEach((b, i) => b.className = `nav-btn flex flex-col items-center ${i+1===n ? 'text-indigo-500' : 'text-slate-300'}`);
            render();
        }

        function importStudents() {
            const raw = document.getElementById('rawList').value.trim();
            if(!raw) return;
            students = raw.split('\n').filter(l => l.trim()).map(line => {
                const parts = line.trim().split(/[\s\t]+/);
                return { id: parts[0], name: parts[1] || "이름없음" };
            });
            save(); toggleModal('setupModal', false);
        }

        function openAttModal(id, name) {
            currentStudentId = id;
            document.getElementById('attModalTitle').innerText = name;
            document.getElementById('noteText').value = "";
            toggleModal('attModal', true);
        }

        function recordAtt(type) {
            const date = document.getElementById('currentDate').value;
            logs.unshift({
                logId: Date.now(),
                studentId: currentStudentId,
                name: students.find(s => s.id == currentStudentId).name,
                date: date,
                type: type,
                note: document.getElementById('noteText').value.trim()
            });
            save(); toggleModal('attModal', false);
        }

        function openEditLog(logId) {
            editingLogId = logId;
            const log = logs.find(l => l.logId === logId);
            if(!log) return;
            document.getElementById('editInfo').innerText = `${log.name} / ${log.type}`;
            document.getElementById('editLogText').value = log.note;
            toggleModal('editLogModal', true);
        }

        function confirmUpdate() {
            const log = logs.find(l => l.logId === editingLogId);
            if(log) { log.note = document.getElementById('editLogText').value.trim(); save(); toggleModal('editLogModal', false); }
        }

        function confirmDelete() {
            if(confirm('기록을 완전히 삭제하시겠습니까?')) {
                logs = logs.filter(l => l.logId !== editingLogId);
                save(); toggleModal('editLogModal', false);
            }
        }

        function save() {
            localStorage.setItem('att_v7_students', JSON.stringify(students));
            localStorage.setItem('att_v7_logs', JSON.stringify(logs));
            render();
        }

        function render() {
            const date = document.getElementById('currentDate').value || new Date().toISOString().split('T')[0];
            const todaysLogs = logs.filter(l => l.date === date);

            document.getElementById('tab1').innerHTML = students.map(s => {
                const log = todaysLogs.find(l => l.studentId === s.id);
                const unpaidCount = logs.filter(l => l.studentId === s.id && l.type.includes('미인정')).length;
                let level = 'level-low';
                if(unpaidCount >= 9) level = 'level-critical';
                else if(unpaidCount >= 5) level = 'level-danger';
                else if(unpaidCount >= 3) level = 'level-warning';

                return `
                <div class="p-6 rounded-[2.5rem] shadow-sm flex justify-between items-center bg-white ${level}">
                    <div>
                        <p class="text-[9px] font-black opacity-30">${s.id}</p>
                        <h3 class="font-black text-lg text-slate-800">${s.name}</h3>
                        <p class="text-[10px] font-bold text-slate-400 mt-1 italic">미인정 누적: ${unpaidCount}회</p>
                    </div>
                    ${log ? 
                        `<button onclick="openEditLog(${log.logId})" class="bg-indigo-500 text-white px-5 py-2.5 rounded-2xl text-[10px] font-black shadow-lg shadow-indigo-100">${log.type}</button>` : 
                        `<button onclick="openAttModal('${s.id}', '${s.name}')" class="w-12 h-12 bg-slate-800 text-white rounded-2xl flex items-center justify-center shadow-lg active:scale-90 transition"><i class="fas fa-plus"></i></button>`
                    }
                </div>`;
            }).join('') || '<div class="text-center py-20 opacity-20 font-black italic">등록된 학생 명단이 없습니다.</div>';

            document.getElementById('allLogs').innerHTML = logs.map(l => `
                <div onclick="openEditLog(${l.logId})" class="bg-white p-5 rounded-[2rem] border-l-8 ${l.type.includes('미인정')?'border-rose-200':l.type.includes('질병')?'border-amber-200':'border-emerald-200'} shadow-sm space-y-1 cursor-pointer">
                    <div class="flex justify-between items-center text-[10px] font-black">
                        <span>${l.name} <span class="text-slate-300 ml-2 font-bold">${l.date}</span></span>
                        <span class="px-2 py-1 rounded-lg ${l.type.includes('미인정')?'bg-rose-50 text-rose-400':l.type.includes('질병')?'bg-amber-50 text-amber-400':'bg-emerald-50 text-emerald-400'}">${l.type}</span>
                    </div>
                    <p class="text-[11px] text-slate-500 font-medium">${l.note || '터치하여 수정/삭제'}</p>
                </div>
            `).join('') || '<div class="text-center py-20 opacity-20 font-black italic underline underline-offset-8">저장된 로그가 없습니다.</div>';
        }

        function exportCSV() {
            let csv = "\ufeff학번,이름,날짜,구분,특이사항\n";
            logs.forEach(l => { csv += `${l.studentId},${l.name},${l.date},${l.type},"${l.note}"\n`; });
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = `곡선중_출결기록_${new Date().toLocaleDateString()}.csv`;
            a.click();
        }

        render();
    </script>
</body>
</html>
